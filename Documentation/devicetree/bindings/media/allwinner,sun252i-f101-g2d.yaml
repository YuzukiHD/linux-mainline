%YAML 1.2
---
$id: http://devicetree.org/schemas/media/allwinner,sun252i-f101-g2d.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner F101 G2D

maintainers:
  - Yuzuki Tsuru <gloomyghost@gloomyghost.com>

description:
  The 2D graphics engine of the F101 converts, scales, rotates and flips
  pictures in memory.

properties:
  compatible:
    const: allwinner,sun252i-f101-g2d

  reg:
    maxItems: 1

  interrupts:
    maxItems: 1

  clocks:
    items:
      - description: Module clock
      - description: Bus gate
      - description: Memory bus gate

  clock-names:
    items:
      - const: mod
      - const: bus
      - const: mbus

  resets:
    maxItems: 1

required:
  - compatible
  - reg
  - interrupts
  - clocks
  - clock-names
  - resets

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/sun252i-f101-ccu.h>
    #include <dt-bindings/interrupt-controller/irq.h>
    #include <dt-bindings/reset/sun252i-f101-ccu.h>

    g2d@5410000 {
        compatible = "allwinner,sun252i-f101-g2d";
        reg = <0x05410000 0x40000>;
        interrupts = <111 IRQ_TYPE_LEVEL_HIGH>;
        clocks = <&ccu CLK_G2D>, <&ccu CLK_BUS_G2D>, <&ccu CLK_BUS_G2D_M>;
        clock-names = "mod", "bus", "mbus";
        resets = <&ccu RST_BUS_G2D>;
    };
