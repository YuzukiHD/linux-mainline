%YAML 1.2
---
$id: http://devicetree.org/schemas/arm/sunxi/allwinner,sun252i-f101-mbus.yaml#
$schema: http://devicetree.org/meta-schemas/core.yaml#

title: Allwinner F101 memory bus (MBUS) arbitration

maintainers:
  - Yuzuki Tsuru <gloomyghost@gloomyghost.com>

description:
  The memory bus of the F101 has registers that set the priority of each bus
  master and limit its bandwidth, and a monitor that counts the traffic of
  the groups of masters. A child node sets the arbitration of one master.

properties:
  compatible:
    const: allwinner,sun252i-f101-mbus

  reg:
    maxItems: 1

  clocks:
    maxItems: 2

  clock-names:
    items:
      - const: bus
      - const: mbus

  resets:
    maxItems: 1

  allwinner,monitor-window-us:
    description: Length of the window the traffic monitor counts bytes in.
    default: 50000
    maximum: 65535

  "#address-cells":
    const: 1

  "#size-cells":
    const: 0

patternProperties:
  "^[a-z0-9-]+@[0-9a-f]+$":
    type: object
    additionalProperties: false
    description: A bus master.

    properties:
      reg:
        maxItems: 1
        description: The number of the master, see the header.

      priority:
        $ref: /schemas/types.yaml#/definitions/uint32
        minimum: 0
        maximum: 3
        description: Arbitration priority, 3 is the highest.

      bandwidth-limit-mbps:
        $ref: /schemas/types.yaml#/definitions/uint32
        description: Bandwidth limit of the master in MB/s, 0 is no limit.

    required:
      - reg

required:
  - compatible
  - reg
  - clocks
  - clock-names

additionalProperties: false

examples:
  - |
    #include <dt-bindings/clock/sun252i-f101-ccu.h>
    #include <dt-bindings/memory/sun252i-f101-mbus.h>

    mbus@3102000 {
        compatible = "allwinner,sun252i-f101-mbus";
        reg = <0x03102000 0x1000>;
        clocks = <&ccu CLK_MBUS>;
        clock-names = "mbus";
        #address-cells = <1>;
        #size-cells = <0>;

        display-engine@10 {
            reg = <SUN252I_F101_MBUS_MASTER_DE>;
            priority = <3>;
        };

        cpu@27 {
            reg = <SUN252I_F101_MBUS_MASTER_RISCV>;
            bandwidth-limit-mbps = <500>;
        };
    };
